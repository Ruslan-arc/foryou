<title>For You</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=JetBrains+Mono:wght@400;600;800&family=Pinyon+Script&display=swap">
<style>
  /* Layout: one full-bleed night stage; the particles carry the moment, words and controls float at its edges */
  :root {
    --night: #0b0710;
    --night-2: #1d1026;
    --ink: #f7ebe6;
    --muted: #a8939f;
    --ember: #ffb36b;
    --rose: #4aa8ff;
    --line: rgba(247, 235, 230, 0.16);
    --chip-bg: rgba(20, 11, 26, 0.55);
    --ember-line: rgba(255, 179, 107, 0.55);
    --ember-wash: rgba(255, 179, 107, 0.08);
    --ember-glow: rgba(255, 168, 92, 0.26);
    --gold-glow: rgba(255, 214, 150, 0.2);
    --rose-glow: rgba(60, 150, 255, 0.24);
    --font-display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
    background: var(--night);
  }

  html, body { height: 100%; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(120% 85% at 50% 36%, var(--night-2) 0%, var(--night) 64%);
    background-color: var(--night);
    color: var(--ink);
    font-family: var(--font-mono);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #sky { z-index: 0; }
  #stage { z-index: 2; touch-action: none; }
  #fx { z-index: 2; pointer-events: none; }
  body[data-phase="intro"] #stage { cursor: pointer; }
  body[data-phase="rose"] #stage { cursor: grab; }
  body[data-phase="rose"] #stage:active { cursor: grabbing; }

  .glow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  .glow-ember { background: radial-gradient(circle at var(--ex, 50%) var(--ey, 44%), var(--ember-glow) 0%, transparent 42vmin); }
  .glow-name { background: radial-gradient(ellipse 70vmax 34vmin at 50% var(--ny, 44%), var(--gold-glow) 0%, transparent 100%); }
  .glow-rose { background: radial-gradient(circle at var(--rx, 50%) var(--ry, 30%), var(--rose-glow) 0%, transparent 48vmin); }
  body[data-phase="intro"] .glow-ember { opacity: 0.45; }
  body[data-phase="opening"] .glow-ember { opacity: 1; transition-duration: 0.5s; }
  body[data-phase="vortex"] .glow-ember { opacity: 0.3; }
  body[data-phase="vortex"] .glow-name { opacity: 0.5; }
  body[data-phase="name"] .glow-name { opacity: 1; }
  body[data-phase="rose"] .glow-rose { opacity: 0; }

  .controls {
    position: fixed;
    z-index: 4;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: 600 11px/1 var(--font-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--chip-bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 13px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .chip::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .chip.plain::before { display: none; }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ember-line); }
  .chip[aria-pressed="true"]::before { background: var(--ember); box-shadow: 0 0 8px var(--ember); }
  .chip:hover { color: var(--ink); }

  .intro {
    position: fixed;
    left: 0;
    right: 0;
    top: 74%;
    z-index: 3;
    display: grid;
    justify-items: center;
    gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    pointer-events: none;
  }
  .label {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .label .who { color: var(--ember); }
  .cta {
    pointer-events: auto;
    font: 600 12px/1 var(--font-mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ember);
    background: var(--ember-wash);
    border: 1px solid var(--ember-line);
    border-radius: 999px;
    padding: 15px 26px;
    cursor: pointer;
    animation: beckon 2.6s ease-out infinite;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .cta:hover { background: var(--ember); color: var(--night); }
  .cta:disabled { cursor: progress; animation: none; color: var(--muted); border-color: var(--line); }

  .chip:focus-visible,
  .cta:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

  .message {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .message .for {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--for-y, 66%);
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font-family: var(--font-display);
    font-size: clamp(20px, 2.6vw, 30px);
    line-height: 1;
    letter-spacing: 0.16em;
    color: var(--ink);
    text-shadow: 0 0 18px var(--rose-glow);
    animation: bloom-in 2.2s cubic-bezier(0.2, 0.7, 0.1, 1) both;
  }
  .message .actions {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 3.5vh, 36px));
    display: flex;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .message .chip {
    pointer-events: auto;
    animation: rise 1.2s 1.4s ease both;
  }

  @keyframes beckon {
    0% { box-shadow: 0 0 0 0 var(--ember-line); }
    70% { box-shadow: 0 0 0 14px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes bloom-in {
    from { opacity: 0; letter-spacing: 0.6em; filter: blur(10px); }
    to { opacity: 1; filter: blur(0); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta, .message .for, .message .chip { animation: none; }
    .glow { transition: none; }
  }
</style>

<canvas id="sky" aria-hidden="true"></canvas>

</div>

<section id="message" class="message" aria-live="polite" hidden>
  <p class="for">Sen uchun<span class="sr-only">, <span class="who">Xalilulloh</span></span></p>
  <div class="actions">
    <button id="replay" class="chip plain" type="button">Qaytadan</button>
  </div>
</section>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
  const SCRIPT = '"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive';
  const DEFAULT_NAME = 'Xalilulloh';
  const stage = document.getElementById('stage');
  const sky = document.getElementById('sky');
  const ctx = stage.getContext('2d');
  const sctx = sky.getContext('2d');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  const body = document.body;
  const introEl = document.getElementById('intro');
  const messageEl = document.getElementById('message');
  const openBtn = document.getElementById('open');
  const replayBtn = document.getElementById('replay');
  const asciiBtn = document.getElementById('ascii');
  const soundBtn = document.getElementById('sound');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Particle palette: envelope warms, blues for the name, white and black cat fur / eyes / nose, sky tones
  const PALETTE = ['#ffb36b', '#ffe2a8', '#b8662e', '#4aa8ff', '#0b3d91', '#1565c0', '#2196f3', '#4fc3f7', '#a6e3ff', '#a8501a', '#ff9f45', '#cfd8ff', '#8a6d9e', '#5fd38a', '#ff9bb0', '#6b2f0f', '#f6f8ff', '#aeb8de', '#6ec6ff', '#59608a', '#3d4266', '#ffd24a', '#9aa3d4'];
  const AMBER = 0, GOLD = 1, AMBER_DIM = 2, HEART = 3, ROSE = 4, STAR = 11, DUST = 12, PINK = 14;
  const WHITE = 16, WSHADE = 17, WEYE = 18, BLACK = 19, BSHADE = 20, BEYE = 21, BHI = 22;
  // colour of each cat point kind: 0 fur, 1 fur in shade, 2 inner ear, 3 eye, 4 nose, 5 whisker, 6 highlight
  const CAT_COLORS = [
    [WHITE, WSHADE, PINK, WEYE, PINK, STAR, WHITE],  // the white cat
    [BLACK, BSHADE, PINK, BEYE, PINK, STAR, BHI],    // the black cat
  ];
  const STAR_COLOR = '#dfe5ff';
  const PETAL_COLOR = '#ff8fb1';

  const prefs = {
    read(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v === '1';
      } catch (e) {
        return fallback;
      }
    },
    write(key, value) {
      try {
        localStorage.setItem(key, value ? '1' : '0');
      } catch (e) {
        // storage unavailable: the toggle still works for this visit
      }
    },
  };
  let asciiMode = prefs.read('foryou-ascii', false);
  let soundOn = prefs.read('foryou-sound', true);

  const sprites = PALETTE.map(makeSprite);

  let W = 0, H = 0, dpr = 1;
  const geo = {
    ew: 0, eh: 0, ecx: 0, ecy: 0, sp: 4, // envelope
    S: 0, rcx: 0, rby: 0,                // rose
    bw: 0, bcy: 0, nw: 0, ncy: 0, forY: 0, // big name, small name under the rose
    fs: 11, cellW: 7, cellH: 12,         // ASCII grid
  };
  let particles = [], stars = [], petals = [];
  let nBig = 0, nameAspect = 0.42, currentName = DEFAULT_NAME;
  let nameMetrics = null, namePts = [], sparkles = [];
  let bigA = 0, smallA = 0, namePulse = 1; // opacity of the crisp big / small name, heartbeat scale
  let grid = new Uint32Array(1), gridCols = 1, gridRows = 1, stamp = 0;
  let phase = 'loading', phaseStart = 0, vortexStart = 0, now = 0;
  let flap = 0, rot = 0.6, rotV = 0, petalsOn = 0;
  let dragging = false, dragMoved = 0, lastPX = 0, messageShown = false, fontReady = false;
  const pointer = { x: -9999, y: -9999, seen: -1e9 };
  let audio = null;

  function makeSprite(hex) {
    const size = 48, c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const r = parseInt(hex.slice(1, 3), 16), gr = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const hot = (v) => Math.round(v + (255 - v) * 0.65);
    const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, `rgba(${hot(r)},${hot(gr)},${hot(b)},1)`);
    grad.addColorStop(0.12, `rgba(${r},${gr},${b},1)`);
    grad.addColorStop(0.32, `rgba(${r},${gr},${b},0.32)`);
    grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function easeInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function heartPath(g, cx, cy, s) {
    g.beginPath();
    for (let i = 0; i <= 60; i++) {
      const t = (i / 60) * TAU;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const px = cx + (x / 32) * s, py = cy - (y / 32) * s;
      if (i) g.lineTo(px, py);
      else g.moveTo(px, py);
    }
    g.closePath();
  }

  // Envelope points, relative to the envelope centre. Flap points carry flap: true so they can swing open.
  function buildEnvelope(ew, eh, sp, budget) {
    if (ew < 20 || eh < 20) return []; // window not laid out yet; resize() rebuilds it
    const hw = ew / 2, hh = eh / 2;
    const off = document.createElement('canvas');
    off.width = Math.ceil(ew);
    off.height = Math.ceil(eh);
    const g = off.getContext('2d', { willReadFrequently: true });
    const font = `800 ${Math.round(eh * 0.2)}px ${MONO}`;
    const textY = eh * 0.77;
    const heart = { x: hw, y: eh * 0.55, s: eh * 0.17 };
    const jit = () => (Math.random() - 0.5) * sp * 0.3;
    const at = (x, y, c, glyph, extra) => Object.assign({ x: x - hw + jit(), y: y - hh + jit(), c, g: glyph, flap: false, a: 1 }, extra);

    const drawText = (pad) => {
      g.font = font;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      if (pad) {
        g.lineWidth = pad;
        g.lineJoin = 'round';
        g.strokeText('FOR YOU', hw, textY);
      }
      g.fillText('FOR YOU', hw, textY);
    };
    const drawHeart = (grow) => {
      heartPath(g, heart.x, heart.y, heart.s + grow);
      g.fill();
    };
    const sample = (step, c, glyph, extra) => {
      const data = g.getImageData(0, 0, off.width, off.height).data;
      const out = [];
      for (let y = step / 2; y < off.height; y += step) {
        for (let x = step / 2; x < off.width; x += step) {
          if (data[((y | 0) * off.width + (x | 0)) * 4 + 3] > 128) out.push(at(x, y, c, glyph, extra));
        }
      }
      return out;
    };

    // Mask keeps lines and stripes from running through the lettering and the seal
    g.fillStyle = g.strokeStyle = '#fff';
    drawText(sp * 2.6);
    drawHeart(sp * 3);
    const mask = g.getImageData(0, 0, off.width, off.height).data;
    const masked = (x, y) => {
      const xi = x | 0, yi = y | 0;
      if (xi < 0 || yi < 0 || xi >= off.width || yi >= off.height) return false;
      return mask[(yi * off.width + xi) * 4 + 3] > 16;
    };

    g.clearRect(0, 0, off.width, off.height);
    drawText(0);
    const text = sample(sp * 0.82, GOLD, '#');
    g.clearRect(0, 0, off.width, off.height);
    drawHeart(0);
    const seal = sample(sp * 0.78, HEART, '@', { flap: true });

    const lines = [];
    const line = (x1, y1, x2, y2, c, glyph, extra) => {
      const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / sp));
      for (let i = 0; i <= n; i++) {
        const t = i / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
        if (!masked(x, y)) lines.push(at(x, y, c, glyph, extra));
      }
    };
    line(0, 0, ew, 0, AMBER, '#');
    line(0, eh, ew, eh, AMBER, '#');
    line(0, 0, 0, eh, AMBER, '#');
    line(ew, 0, ew, eh, AMBER, '#');
    line(0, 0, hw, eh * 0.55, GOLD, '\\', { flap: true });
    line(ew, 0, hw, eh * 0.55, GOLD, '/', { flap: true });
    line(0, eh, ew * 0.36, eh * 0.5, AMBER, '/');
    line(ew, eh, ew * 0.64, eh * 0.5, AMBER, '\\');

    const stripes = [];
    for (let y = sp * 3; y < eh - sp * 2; y += sp * 2.6) {
      for (let x = sp * 2; x < ew - sp * 1.5; x += sp * 1.3) {
        if (!masked(x, y)) stripes.push(at(x, y, AMBER_DIM, '-', { a: 0.55 }));
      }
    }

    const fixed = text.concat(seal);
    let rest = budget - fixed.length;
    const keepLines = rest >= lines.length ? lines : shuffle(lines).slice(0, Math.max(0, rest));
    rest -= keepLines.length;
    return fixed.concat(keepLines, shuffle(stripes).slice(0, Math.max(0, rest)));
  }

  // His name in the script face, as points normalised by the text width (u across, v down, both centred)
  function sampleName(name, n) {
    const fontPx = 160, pad = 12;
    const off = document.createElement('canvas');
    const g = off.getContext('2d', { willReadFrequently: true });
    g.font = `${fontPx}px ${SCRIPT}`;
    const m = g.measureText(name);
    const left = m.actualBoundingBoxLeft || 0;
    const right = m.actualBoundingBoxRight || m.width;
    const asc = m.actualBoundingBoxAscent || fontPx * 0.8;
    const desc = m.actualBoundingBoxDescent || fontPx * 0.3;
    const tw = Math.max(1, left + right), th = Math.max(1, asc + desc);
    off.width = Math.ceil(tw + pad * 2);
    off.height = Math.ceil(th + pad * 2);
    g.font = `${fontPx}px ${SCRIPT}`;
    g.fillStyle = g.strokeStyle = '#fff';
    g.lineWidth = 2.5;
    g.lineJoin = 'round';
    g.fillText(name, pad + left, pad + asc);
    g.strokeText(name, pad + left, pad + asc);
    const data = g.getImageData(0, 0, off.width, off.height).data;

    let hits = [];
    for (const step of [2.5, 1.8, 1.3]) {
      hits = [];
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          if (data[((y | 0) * off.width + (x | 0)) * 4 + 3] > 128) hits.push([x, y]);
        }
      }
      if (hits.length >= n) break;
    }
    shuffle(hits);
    const cx = pad + tw / 2, cy = pad + th / 2;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const [x, y] = hits.length ? hits[i % hits.length] : [cx, cy];
      const spread = i >= hits.length ? 1.6 : 0; // reused points get a little jitter
      const u = (x - cx + (Math.random() - 0.5) * spread) / tw;
      const v = (y - cy + (Math.random() - 0.5) * spread) / tw;
      const t = Math.abs(u) * 2; // gold in the middle, sky blue towards the ends
      pts.push({ u, v, c: t < 0.35 ? GOLD : t < 0.7 ? ROSE + 4 : ROSE + 3, g: '#' });
    }
    return { pts, aspect: th / tw, metrics: { fontPx, tw, left, right, asc, desc } };
  }

  // @@CAT-START
  // Two kittens seen from behind at the water's edge at night: the white one rests her head on the black one's
  // shoulder. Every point has a surface normal so the fur can be lit, and the cats are painted solid from far to
  // near, so they hide the sea behind them and can be turned around with a finger.
  const CT = Math.cos(0.22), ST = Math.sin(0.22), YC = 0.1;
  const unit = (x, y, z) => { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; };
  const L1 = unit(0.25, 0.35, 0.9);   // moonlight from above
  const L2 = unit(-0.1, 0.9, 0.25);   // glow of the town across the water
  // fur sprites: white ramp 0-7, black ramp 8-15, then eyes, nose, inner ears, whiskers
  const FUR_COLORS = [
    '#3b3b47', '#5a5a68', '#7e7d8b', '#a5a3b0', '#c8c4cc', '#e4ded9', '#f6efe8', '#fffaf2',
    '#050507', '#08080c', '#0d0d13', '#14141c', '#1d1d28', '#2a2630', '#473a3a', '#7a5b45',
    '#8fd0ff', '#ffc83a', '#e59aa6', '#f3b8c2', '#6a4048', '#f2f2f8', '#7b7b92',
  ];
  const furSprites = FUR_COLORS.map(makeFurSprite);
  function makeFurSprite(hex) {
    const size = 32, c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const r = parseInt(hex.slice(1, 3), 16), gr = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, `rgba(${r},${gr},${b},1)`);
    grad.addColorStop(0.55, `rgba(${r},${gr},${b},0.8)`);
    grad.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  // centre line of each tail: the white one curls round her left side, the black one sweeps out in front
  const TAIL = [
    (s) => [-0.35 - 0.55 * Math.sin(s * 1.9), -0.5 + Math.pow(s, 1.2), 0.12 + 0.16 * s * (1 - s) + 0.25 * s * s * s],
    (s) => [0.2 - 0.85 * s - 0.2 * Math.sin(s * Math.PI), -0.5 - 0.9 * s, 0.1 + 0.06 * Math.sin(s * 3)],
  ];

  // One sitting kitten facing +Y (away from the camera). Parts: 0 body, 1 head, 2 tail, 3 / 4 left / right ear.
  function buildKitten(n, o) {
    const pts = [];
    const dir = () => {
      for (;;) {
        const x = Math.random() * 2 - 1, y = Math.random() * 2 - 1, z = Math.random() * 2 - 1, d = x * x + y * y + z * z;
        if (d <= 1 && d > 0.01) { const l = Math.sqrt(d); return [x / l, y / l, z / l]; }
      }
    };
    const put = (part, kind, X, Y, Z, nx, ny, nz, extra) => {
      pts.push(Object.assign({ part, kind, x: X, y: Y, z: Z, nx, ny, nz, j: (Math.random() - 0.5) * 0.14 }, extra));
      return true;
    };
    const shell = (part, cx, cy, cz, rx, ry, rz, count, kind, pick, fz) => {
      const fuzz = fz === undefined ? o.fuzz : fz;
      for (let done = 0, tries = 0; done < count && tries < count * 25; tries++) {
        const [a, b, c] = dir();
        let nx = a / rx, ny = b / ry, nz = c / rz;
        const l = Math.hypot(nx, ny, nz);
        nx /= l; ny /= l; nz /= l;
        const k = 1 - 0.06 * Math.random(), f = fuzz * Math.random();
        const X = cx + a * rx * k + nx * f, Y = cy + b * ry * k + ny * f, Z = cz + c * rz * k + nz * f;
        if (pick && !pick(X, Y, Z)) continue;
        put(part, kind, X, Y, Z, nx, ny, nz);
        done++;
      }
    };
    const tri = (A, B, C) => {
      let u = Math.random(), v = Math.random();
      if (u + v > 1) { u = 1 - u; v = 1 - v; }
      return [A[0] + u * (B[0] - A[0]) + v * (C[0] - A[0]), A[1] + u * (B[1] - A[1]) + v * (C[1] - A[1])];
    };
    const q = (f) => Math.round(n * f);
    const nHaunch = q(0.22), nTorso = q(0.14), nChest = q(0.06), nNeck = q(0.04), nLeg = q(0.03), nPaw = q(0.02), nFoot = q(0.02);
    const nEar = q(0.03), nEarIn = q(0.01), nEye = q(0.01), nNose = q(0.004), nMuz = q(0.01), nWh = q(0.02), nTail = q(0.08);
    const nHead = n - (nHaunch + nTorso + nChest + nNeck + 2 * nLeg + 2 * nPaw + 2 * nFoot + nEar + nEarIn + nEye + nNose + nMuz + nWh + nTail);

    shell(0, 0, -0.05, 0.5, 0.58, 0.55, 0.5, nHaunch, 0);
    shell(0, 0, 0.1, 0.98, 0.42, 0.42, 0.55, nTorso, 0);
    shell(0, 0, 0.3, 0.85, 0.34, 0.28, 0.45, nChest, 0);
    shell(1, 0, 0.15, 1.32, 0.3, 0.28, 0.26, nNeck, 0);
    for (const sx of [-1, 1]) {
      for (let i = 0; i < nLeg; i++) {
        const a = Math.random() * TAU, f = o.fuzz * Math.random();
        put(0, 0, sx * 0.2 + Math.cos(a) * (0.1 + f), 0.42 + Math.sin(a) * (0.1 + f), 0.9 * Math.random(), Math.cos(a), Math.sin(a), 0);
      }
      shell(0, sx * 0.2, 0.5, 0.06, 0.12, 0.17, 0.07, nPaw, 0);
      shell(0, sx * 0.45, 0.28, 0.07, 0.14, 0.3, 0.08, nFoot, 0);
    }
    // head; the fur leaves the eyes clear
    shell(1, 0, 0.12, 1.55, 0.43, 0.37, 0.34, nHead, 0, (X, Y, Z) =>
      !(Y > 0.3 && Math.abs(Math.abs(X) - 0.17) < 0.09 && Math.abs(Z - 1.6) < 0.09 && Math.random() < 0.85));
    for (let i = 0; i < nEye; i++) {
      const sx = i % 2 ? 1 : -1, a = Math.random() * TAU, r = Math.sqrt(Math.random());
      put(1, 3, sx * 0.17 + Math.cos(a) * r * 0.05, 0.462, 1.6 + Math.sin(a) * r * 0.055, 0, 1, 0);
    }
    shell(1, 0, 0.47, 1.47, 0.14, 0.1, 0.1, nMuz, 6);
    shell(1, 0, 0.555, 1.5, 0.035, 0.03, 0.03, nNose, 4, null, 0.01);
    const perW = Math.max(1, Math.round(nWh / 6));
    for (const sx of [-1, 1]) {
      for (let w = 0; w < 3; w++) {
        for (let i = 0; i < perW; i++) {
          const t = Math.random();
          put(1, 5, sx * (0.12 + 0.42 * t), 0.5 + 0.2 * t, 1.47 + (w - 1) * 0.08 * t - 0.04 * t * t, 0, 0, 1);
        }
      }
    }
    // ears: fur on the back, pink inside
    for (let i = 0; i < nEar + nEarIn; i++) {
      const sx = i % 2 ? 1 : -1, inner = i >= nEar, part = sx < 0 ? 3 : 4;
      let A = [sx * 0.1, 1.82], B = [sx * 0.42, 1.72], C = [sx * 0.33, 2.12];
      if (inner) {
        const cxz = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3 - 0.03];
        [A, B, C] = [A, B, C].map((P) => [cxz[0] + (P[0] - cxz[0]) * 0.55, cxz[1] + (P[1] - cxz[1]) * 0.55]);
      }
      const [x, z] = tri(A, B, C);
      if (inner) put(part, 2, x, 0.17, z, 0, 1, 0.1);
      else { const [nx, ny, nz] = unit(sx * 0.2, -0.85, 0.45); put(part, 0, x, 0.06 + Math.random() * 0.05, z, nx, ny, nz); }
    }
    for (let i = 0; i < nTail; i++) {
      const s = Math.random(), r = (o.tailR - o.tailT * s) * (0.85 + Math.random() * 0.15), [a, b, c] = dir();
      put(2, 0, 0, 0, 0, a, b, c, { s, ox: a * r, oy: b * r, oz: c * r });
    }
    return pts;
  }

  function buildCats(n) {
    const h = n >> 1;
    const a = buildKitten(h, { fuzz: 0.07, tailR: 0.125, tailT: 0.05 }); // white: fluffy
    const b = buildKitten(n - h, { fuzz: 0.03, tailR: 0.085, tailT: 0.03 }); // black: sleek
    a.forEach((p) => { p.cat = 0; });
    b.forEach((p) => { p.cat = 1; });
    return a.concat(b);
  }

  let cats = [], hearts = [], catsA = 0, seaA = 0, camYaw = 0, userYaw = 0, tapT = -9, nextHeart = 3, sceneT = 0;
  let cpY = 1, spY = 0;
  const catParts = [];   // particles that are part of a cat this frame, for painting far to near
  const tmp = { x: 0, y: 0, dep: 0, f: 1, fc: 0, c: 0, m: 1 };

  function makeCat(i) {
    return {
      i, x: i ? 0.85 : -0.38, s: i ? 1.04 : 0.97, lean: i ? -0.03 : 0.12, cl: 1, sl: 0,
      amb: i ? 0.18 : 0.66, rimK: i ? 0.9 : 0.4,
      roll: 0, pitch: 0, yaw: 0, hx: 0, hy: 0, hz: 0, cr: 1, sr: 0, cp: 1, sp: 0, cyw: 1, syw: 0,
      br: 0, ear: [0, 0], tailW: i ? 1.1 : 1.6, tailA: i ? 0.14 : 0.05,
    };
  }

  // The small movements that keep them alive: breathing, ear flicks, tails, a slow look around
  function updateCats(t) {
    const mo = reduceMotion ? 0 : 1;
    const tw = (ph) => 0.35 * mo * Math.pow(Math.max(0, Math.sin(t * 0.8 + ph)), 26);
    const tap = Math.max(0, 1 - (t - tapT) / 0.7) * 0.4;
    const [w, b] = cats;
    w.br = Math.sin(t * 1.9);
    b.br = Math.sin(t * 1.7 + 0.8);
    w.roll = 0.55 + 0.025 * mo * Math.sin(t * 0.9);
    w.pitch = -0.05 + 0.025 * mo * w.br;
    w.yaw = 0.06 * mo * Math.sin(t * 0.4);
    w.hx = 0.2 + 0.012 * mo * w.br; w.hz = -0.2;
    b.roll = -0.08 + 0.02 * mo * Math.sin(t * 0.7);
    b.pitch = 0.02 * mo * Math.sin(t * 0.5);
    b.yaw = mo * (0.1 * Math.sin(t * 0.3) + 0.2 * Math.pow(Math.max(0, Math.sin(t * 0.17)), 6));
    w.ear = [tw(0) + tap, tw(2.1) + tap];
    b.ear = [tw(1.3) + tap, tw(3.4) + tap];
    for (const c of cats) {
      c.cl = Math.cos(c.lean); c.sl = Math.sin(c.lean);
      c.cr = Math.cos(c.roll); c.sr = Math.sin(c.roll);
      c.cp = Math.cos(c.pitch); c.sp = Math.sin(c.pitch);
      c.cyw = Math.cos(c.yaw); c.syw = Math.sin(c.yaw);
    }
  }

  function projectPt(Xw, Yw, Zw, out) {
    const Xr = Xw * cpY + (Yw - YC) * spY, Yr = -Xw * spY + (Yw - YC) * cpY + YC;
    const up = Zw * CT + Yr * ST, depth = Yr * CT - Zw * ST, f = 10 / (10 + depth);
    out.x = geo.cx + Xr * geo.C * f;
    out.y = geo.gy - up * geo.C * f;
    out.dep = depth;
    out.f = f;
  }

  // Where one point of a cat is on the screen right now, and how it is lit
  function catPoint(P, c, out) {
    const part = P.part;
    let X = P.x, Y = P.y, Z = P.z;
    if (part === 0) {
      Z += Math.max(0, Z - 0.4) * 0.025 * c.br;
    } else if (part === 2) {
      const cen = TAIL[c.i](P.s), w = Math.sin(now * c.tailW - P.s * 2.2);
      X = cen[0] + P.ox + c.tailA * P.s * w * (c.i ? -1 : 1);
      Y = cen[1] + P.oy;
      Z = cen[2] + P.oz + 0.03 * P.s * Math.sin(now * c.tailW * 0.7);
    } else {
      if (part >= 3) {
        const sx = part === 3 ? -1 : 1, ang = c.ear[part - 3] * sx, dx = X - sx * 0.28, dz = Z - 1.8;
        X = sx * 0.28 + dx * Math.cos(ang) + dz * Math.sin(ang);
        Z = 1.8 - dx * Math.sin(ang) + dz * Math.cos(ang);
      }
      const dx = X, dy = Y - 0.1, dz = Z - 1.3;
      const x1 = dx * c.cr + dz * c.sr, z1 = -dx * c.sr + dz * c.cr;
      const y1 = dy * c.cp - z1 * c.sp, z2 = dy * c.sp + z1 * c.cp;
      X = x1 * c.cyw - y1 * c.syw + c.hx;
      Y = 0.1 + x1 * c.syw + y1 * c.cyw + c.hy;
      Z = 1.3 + z2 + c.hz + 0.006 * c.br;
    }
    const x2 = X * c.cl + Z * c.sl, z3 = -X * c.sl + Z * c.cl;
    const Xw = x2 * c.s + c.x, Yw = Y * c.s, Zw = z3 * c.s;
    projectPt(Xw, Yw, Zw, out);

    const kind = P.kind;
    out.m = kind === 3 ? 0.8 : kind === 4 ? 0.7 : kind === 5 ? 0.55 : 1;
    if (kind === 0 || kind === 6) {
      const nx = P.nx, ny = P.ny, nz = P.nz;
      const dif = Math.max(0, nx * L1[0] + ny * L1[1] + nz * L1[2]);
      const dif2 = Math.max(0, nx * L2[0] + ny * L2[1] + nz * L2[2]);
      const rim = Math.pow(1 - Math.min(1, Math.abs(-nx * spY + ny * cpY)), 2.2);
      const rimW = rim * Math.max(0, ny + 0.6);
      const ao = (0.6 + 0.4 * Math.min(1, Zw / 0.7)) * (1 - (Zw < 1.25 ? 0.3 : 0.1) * Math.exp(-Math.pow((Xw - 0.2) / 0.24, 2)));
      const I = ao * (c.amb + 0.42 * dif + 0.2 * dif2 + c.rimK * rimW) + P.j;
      let idx = Math.max(0, Math.min(7, Math.floor(I * 7.99)));
      if (kind === 6) idx = Math.min(7, idx + 1);
      out.fc = (c.i ? 8 : 0) + idx;
      out.c = c.i ? (idx > 4 ? CAT_COLORS[1][6] : CAT_COLORS[1][0]) : (idx > 4 ? CAT_COLORS[0][0] : CAT_COLORS[0][1]);
    } else {
      out.fc = kind === 3 ? 16 + c.i : kind === 4 ? 18 : kind === 2 ? 19 + c.i : 21 + c.i;
      out.c = CAT_COLORS[c.i][kind];
    }
  }

  function spawnHeart(x, y, s) {
    hearts.push({ x, y, vx: (Math.random() - 0.5) * 18, vy: -(28 + Math.random() * 28), s: s * (0.7 + Math.random() * 0.6), t: 0, life: 1.6 + Math.random() * 0.8, ph: Math.random() * TAU });
    if (hearts.length > 60) hearts.shift();
  }
  function burst(x, y, n, s) { for (let i = 0; i < n; i++) spawnHeart(x + (Math.random() - 0.5) * s * 2, y + (Math.random() - 0.5) * s, s); }

  function initCats() {
    cats = [makeCat(0), makeCat(1)];
    hearts = [];
    userYaw = 0; camYaw = 0; cpY = 1; spY = 0;
    sceneT = 0; nextHeart = 3;
    geo.cx = W / 2 - 0.235 * geo.C;
    updateCats(now);
  }

  // A tap: ears flick and hearts float up
  function cheer(px, py) {
    tapT = now;
    burst(px, py, 6, geo.C * 0.16);
    meow(520);
  }

  function updateScene(ds) {
    sceneT += ds;
    if (!dragging) userYaw *= Math.pow(0.992, ds * 60);   // the view drifts back to behind them
    camYaw = (reduceMotion ? 0 : 0.07 * Math.sin(now * 0.23)) + userYaw;
    cpY = Math.cos(camYaw); spY = Math.sin(camYaw);
    geo.cx = W / 2 - 0.235 * geo.C;
    updateCats(now);
    nextHeart -= ds;
    if (nextHeart < 0 && !reduceMotion && sceneT > 3) {
      projectPt(0.3, 0.1, 2.35, tmp);
      spawnHeart(tmp.x, tmp.y, geo.C * 0.14);
      nextHeart = 3.5 + Math.random() * 3;
    }
    for (const h of hearts) {
      h.t += ds;
      h.y += h.vy * ds;
      h.x += (Math.sin(h.t * 3 + h.ph) * 14 + h.vx * 0.3) * ds;
    }
    hearts = hearts.filter((h) => h.t < h.life);
  }

  // ---------- the night shore behind them ----------
  let seaBg = null, seaLights = [];
  function buildSea() {
    if (W < 20 || H < 20) return;
    const c = document.createElement('canvas');
    c.width = Math.round(W);
    c.height = Math.round(H);
    const g = c.getContext('2d');
    const hy = geo.hy, st = geo.st;
    let gr = g.createLinearGradient(0, 0, 0, hy);
    gr.addColorStop(0, '#0f1226');
    gr.addColorStop(0.5, '#25253a');
    gr.addColorStop(0.82, '#4b3f48');
    gr.addColorStop(1, '#8c6446');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, hy + 1);
    g.save();
    g.beginPath();
    g.rect(0, 0, W, hy + 1);
    g.clip();
    g.translate(W * 0.36, hy);
    g.scale(1, 0.4);
    gr = g.createRadialGradient(0, 0, 0, 0, 0, W * 0.6);
    gr.addColorStop(0, 'rgba(255,175,85,0.6)');
    gr.addColorStop(0.4, 'rgba(255,140,70,0.2)');
    gr.addColorStop(1, 'rgba(255,120,60,0)');
    g.fillStyle = gr;
    g.fillRect(-W, -W, 2 * W, 2 * W);
    g.restore();
    // the lights of a town far across the water
    seaLights = [];
    const x0 = W * 0.04, x1 = W * 0.7;
    for (let x = x0; x < x1; x += 2) {
      const mid = Math.max(0, 1 - Math.abs((x - W * 0.36) / (W * 0.34)));
      g.fillStyle = `rgba(255,196,110,${(mid * 0.9 * (0.5 + 0.5 * Math.random())).toFixed(2)})`;
      g.fillRect(x, hy - 2 - Math.random() * 2, 2, 2.5);
    }
    for (let i = 0; i < 46; i++) {
      seaLights.push({ x: x0 + Math.random() * (x1 - x0), y: hy - 1 - Math.random() * 4, r: 1 + Math.random() * 1.4, sp: 1 + Math.random() * 2.5, ph: Math.random() * TAU });
    }
    gr = g.createLinearGradient(0, hy, 0, st);
    gr.addColorStop(0, '#2d3c4b');
    gr.addColorStop(0.5, '#1d2b39');
    gr.addColorStop(1, '#122230');
    g.fillStyle = gr;
    g.fillRect(0, hy, W, st - hy + 1);
    for (let i = 0; i < 70; i++) {
      const x = x0 + Math.random() * (x1 - x0), len = (st - hy) * (0.15 + Math.random() * 0.5);
      gr = g.createLinearGradient(0, hy, 0, hy + len);
      gr.addColorStop(0, 'rgba(255,170,90,0.28)');
      gr.addColorStop(1, 'rgba(255,170,90,0)');
      g.fillStyle = gr;
      g.fillRect(x, hy, 1.5 + Math.random() * 2, len);
    }
    gr = g.createLinearGradient(0, hy, 0, hy + 7);
    gr.addColorStop(0, 'rgba(225,235,250,0.55)');
    gr.addColorStop(1, 'rgba(225,235,250,0)');
    g.fillStyle = gr;
    g.fillRect(0, hy, W, 7);
    // wet gravel
    gr = g.createLinearGradient(0, st, 0, H);
    gr.addColorStop(0, '#3b3a3b');
    gr.addColorStop(0.12, '#2c2927');
    gr.addColorStop(1, '#14120f');
    g.fillStyle = gr;
    g.fillRect(0, st, W, H - st);
    const pebbles = Math.round(W * (H - st) * 0.0016);
    for (let i = 0; i < pebbles; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(90,82,72,0.45)' : 'rgba(10,9,7,0.5)';
      g.beginPath();
      g.arc(Math.random() * W, st + Math.random() * (H - st), 0.5 + Math.random() * 1.5, 0, TAU);
      g.fill();
    }
    g.strokeStyle = 'rgba(225,235,250,0.5)';
    g.lineWidth = 2.5;
    g.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const y = st + Math.sin(x * 0.03) * 2 + Math.sin(x * 0.11);
      if (x) g.lineTo(x, y);
      else g.moveTo(x, y);
    }
    g.stroke();
    seaBg = c;
  }

  function drawSea() {
    if (seaA < 0.01 || !seaBg) return;
    const hy = geo.hy, st = geo.st;
    sctx.globalAlpha = seaA;
    sctx.drawImage(seaBg, 0, 0, W, H);
    // waves rolling in
    sctx.strokeStyle = '#dfeaff';
    for (let k = 0; k < 3; k++) {
      const u = (now * 0.045 + k / 3) % 1, y0 = hy + (st - hy) * Math.pow(u, 1.8);
      sctx.globalAlpha = seaA * 0.32 * Math.sin(Math.PI * u);
      sctx.lineWidth = 1 + 3 * u;
      sctx.beginPath();
      for (let x = 0; x <= W; x += 10) {
        const y = y0 + Math.sin(x * 0.018 + now * 0.9 + k * 2) * (1 + 3 * u);
        if (x) sctx.lineTo(x, y);
        else sctx.moveTo(x, y);
      }
      sctx.stroke();
    }
    sctx.fillStyle = '#ffe2b0';
    for (const l of seaLights) {
      sctx.globalAlpha = seaA * 0.9 * (0.5 + 0.5 * Math.sin(now * l.sp + l.ph));
      sctx.fillRect(l.x, l.y, l.r, l.r);
    }
    // soft shadow under the two of them
    if (cats.length) {
      projectPt(0.25, 0.1, 0, tmp);
      const rx = geo.C * 1.7 * tmp.f, ry = rx * 0.2;
      sctx.save();
      sctx.translate(tmp.x, tmp.y);
      sctx.scale(1, ry / rx);
      const g = sctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, 'rgba(0,0,0,0.6)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      sctx.globalAlpha = seaA;
      sctx.fillStyle = g;
      sctx.beginPath();
      sctx.arc(0, 0, rx, 0, TAU);
      sctx.fill();
      sctx.restore();
    }
    sctx.globalAlpha = 1;
  }

  // Hearts that float up from the pair
  function drawCatFx() {
    if (catsA < 0.01 || !hearts.length) return;
    fctx.fillStyle = '#ff6f9c';
    fctx.shadowColor = 'rgba(255,90,140,0.9)';
    fctx.shadowBlur = 8 * dpr;
    for (const h of hearts) {
      fctx.globalAlpha = catsA * Math.min(1, h.t * 4) * (1 - h.t / h.life);
      heartPath(fctx, h.x, h.y, h.s);
      fctx.fill();
    }
    fctx.shadowBlur = 0;
    fctx.globalAlpha = 1;
  }
  // @@CAT-END

  function makeParticle() {
    const fx = Math.random(), fy = Math.random(), q = Math.random();
    return {
      x: fx * W, y: fy * H,
      vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8,
      fx, fy, // home position (as a fraction of the screen) while the particle is just dust
      ph: Math.random() * TAU, q, kv: Math.random(),
      size: 8 + Math.random() * 6, sz: 1, da: 1, delay: 0,
      e: null, n: null, r: null, small: false, // envelope, name and rose targets
      c: q < 0.3 ? STAR : DUST, g: '.', a: 0.35,
    };
  }

  function makePetal(anywhere) {
    return {
      x: Math.random() * W, y: anywhere ? Math.random() * H : -20,
      vy: 0.25 + Math.random() * 0.5, ph: Math.random() * TAU,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.03, s: 5 + Math.random() * 6,
    };
  }

  function dress(p) {
    if ((phase === 'intro' || phase === 'opening') && p.e) {
      p.c = p.e.c; p.g = p.e.g; p.a = p.e.a;
    } else if ((phase === 'vortex' && (p.n || p.r)) || (phase === 'name' && p.n)) {
      p.c = Math.random() < 0.16 ? GOLD : ROSE + 2;
      p.g = p.n ? p.n.g : p.r.g; p.a = 0.95;
    } else if (phase === 'rose' && p.small && p.n) {
      p.g = p.n.g; p.a = 1;
    } else if (phase === 'rose' && p.r) {
      p.g = p.r.g; p.a = 1;
    } else {
      const bright = p.q < 0.3;
      p.c = bright ? STAR : DUST; p.g = bright ? '+' : '.'; p.a = bright ? 0.5 : 0.35;
    }
  }

  function setPhase(next) {
    const prev = phase;
    phase = next;
    phaseStart = now;
    body.dataset.phase = next;
    if (next === 'vortex' || (next === 'name' && prev !== 'vortex')) vortexStart = now;
    for (const p of particles) {
      if (next === 'intro') p.delay = Math.random() * 1.2;
      // the name is written left to right: each particle leaves the swirl when the "pen" reaches it
      else if (next === 'name') p.delay = p.n && !reduceMotion ? (p.n.u + 0.5) * 1.5 + Math.random() * 0.15 : 0;
      else if (next === 'rose') p.delay = p.small || !p.r ? 0 : p.r.kind === 0 ? Math.random() * 0.7 : 0.4 + Math.random() * 0.9;
      else p.delay = 0;
      dress(p);
    }
    if (next === 'vortex') {
      for (const p of particles) {
        const dx = p.x - geo.ecx, dy = p.y - geo.ecy, len = Math.hypot(dx, dy) || 1, kick = 2 + Math.random() * 5;
        p.vx += (dx / len) * kick;
        p.vy += (dy / len) * kick;
      }
    }
    if (next === 'name') nameSound();
    if (next === 'rose') {
      messageShown = false;
      initCats();
      bloomSound();
    }
  }

  function buildEnvelopeTargets() {
    const pts = shuffle(buildEnvelope(geo.ew, geo.eh, geo.sp, Math.round(particles.length * 0.7)));
    particles.forEach((p, i) => {
      p.e = pts[i] || null;
      if (phase === 'intro' || phase === 'opening') dress(p);
    });
  }

  function buildNameTargets() {
    const { pts, aspect, metrics } = sampleName(currentName, nBig);
    nameAspect = aspect;
    nameMetrics = metrics;
    namePts = pts;
    particles.forEach((p, i) => { p.n = pts[i] || null; });
    sparkles = Array.from({ length: 18 }, makeSparkle);
    layoutName();
  }

  function layoutName() {
    geo.bw = Math.min(W * 0.88, 960, (H * 0.42) / nameAspect);
    geo.bcy = H * 0.44;
    geo.forY = geo.gy + geo.C * 0.65 + 34;
    const nameTop = geo.forY + 34;
    const room = H - nameTop - 76; // keep clear of the replay button
    geo.nw = Math.max(80, Math.min(W * 0.62, 440, room / nameAspect));
    geo.ncy = nameTop + (geo.nw * nameAspect) / 2;
    body.style.setProperty('--ny', `${geo.bcy}px`);
    body.style.setProperty('--for-y', `${Math.round(geo.forY)}px`);
  }

  function readName() {
    try {
      const raw = decodeURIComponent(location.hash.slice(1)).replace(/[-_~.]+/g, ' ').trim();
      if (raw && raw.length <= 24) return raw.charAt(0).toUpperCase() + raw.slice(1);
    } catch (e) {
      // malformed hash: keep the default name
    }
    return DEFAULT_NAME;
  }

  // His name: "Xalilulloh" by default, or whatever follows # in the link (…#Malika)
  function applyName() {
    currentName = readName();
    for (const el of document.querySelectorAll('.who')) el.textContent = currentName;
    if (fontReady) buildNameTargets();
  }

  function measure() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
  }

  function resize() {
    measure();
    for (const c of [stage, sky, fx]) {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    geo.ew = Math.min(W * 0.86, 620, H * 0.92);
    geo.eh = geo.ew * 0.62;
    geo.ecx = W / 2;
    geo.ecy = H * 0.44;
    geo.sp = Math.max(3.2, geo.ew / 165);
    geo.S = Math.min(W * 0.32, H * 0.19);
    geo.gy = H * 0.6;                              // where the cats sit
    geo.C = Math.min(W * 0.31, H * 0.22);          // pixels per cat unit
    geo.hy = geo.gy - 1.75 * geo.C;                // horizon
    geo.st = geo.gy - 0.55 * geo.C;                // water's edge
    geo.cx = W / 2 - 0.235 * geo.C;
    geo.rcx = W / 2;
    geo.rby = H * 0.3;
    layoutName();

    geo.fs = Math.max(9, Math.min(13, geo.ew / 58));
    geo.cellW = geo.fs * 0.62;
    geo.cellH = geo.fs * 1.15;
    gridCols = Math.ceil(W / geo.cellW) + 2;
    gridRows = Math.ceil(H / geo.cellH) + 2;
    grid = new Uint32Array(gridCols * gridRows);
    stamp = 0;

    body.style.setProperty('--ex', `${geo.ecx}px`);
    body.style.setProperty('--ey', `${geo.ecy}px`);
    body.style.setProperty('--rx', `${geo.rcx}px`);
    body.style.setProperty('--ry', `${geo.gy - geo.C * 0.9}px`);
    introEl.style.top = `${Math.round(geo.ecy + geo.eh / 2 + Math.max(28, H * 0.05))}px`;

    buildSea();
    if (fontReady) buildEnvelopeTargets();
  }

  function step(dt) {
    let pt = now - phaseStart;
    if (phase === 'opening') {
      flap = easeInOut(Math.min(pt / 0.75, 1)) * Math.PI * 0.94;
      if (pt > 0.95) setPhase(reduceMotion ? 'name' : 'vortex');
    } else if (phase === 'vortex') {
      if (pt > 1.3) setPhase('name');
    } else if (phase === 'name') {
      if (pt > 5.2) setPhase('rose');
    } else if (phase === 'rose') {
      if (!messageShown && pt > 2.2) {
        messageShown = true;
        messageEl.hidden = false;
      }
    } else {
      flap = 0;
    }
    pt = now - phaseStart;
    const vt = now - vortexStart;

    petalsOn += ((phase === 'rose' ? 1 : 0) - petalsOn) * Math.min(1, 0.02 * dt);
    catsA += ((phase === 'rose' ? 1 : 0) - catsA) * Math.min(1, 0.03 * dt);
    seaA += ((phase === 'rose' ? 1 : 0) - seaA) * Math.min(1, 0.03 * dt);
    catParts.length = 0;
    if (phase === 'rose' && cats.length) updateScene(dt / 60);
    const vcx = W / 2, vcy = geo.bcy, Rv = Math.min(W, H) * 0.36;
    const bob = reduceMotion ? 0 : Math.sin(now * 1.3) * 5;
    namePulse = reduceMotion ? 1 : 1 + 0.02 * Math.sin(pt * 2.4);
    // crisp lettering fades in once the particles have written the name, and out as they leave
    const bigTarget = phase === 'name' && pt > 1.9 ? 0.95 : 0;
    bigA += (bigTarget - bigA) * Math.min(1, (bigTarget > bigA ? 0.05 : 0.15) * dt);
    const smallTarget = phase === 'rose' && pt > 1.5 ? 1 : 0;
    smallA += (smallTarget - smallA) * Math.min(1, (smallTarget > smallA ? 0.04 : 0.15) * dt);
    const hinge = -geo.eh / 2;
    const cf = Math.cos(flap), flapStretch = 1 + 0.06 * Math.sin(flap);
    const repel = !reduceMotion && !dragging && phase !== 'rose' && now - pointer.seen < 2.5;
    const onEnvelope = phase === 'intro' || phase === 'opening';

    for (const p of particles) {
      let tx, ty, k = 0.02 + p.kv * 0.025, damp = 0.86;
      p.da = 1;
      p.sz = 1;
      p.isCat = false;
      if (onEnvelope && p.e) {
        let ex = p.e.x, ey = p.e.y;
        if (p.e.flap && flap > 0) {
          ey = hinge + (ey - hinge) * cf;
          ex *= flapStretch;
          p.c = cf < 0 && p.e.c !== HEART ? AMBER_DIM : p.e.c;
        }
        tx = geo.ecx + ex;
        ty = geo.ecy + ey + bob;
      } else if ((phase === 'vortex' && (p.n || p.r)) || (phase === 'name' && p.n && pt < p.delay)) {
        // galaxy swirl; during the name phase particles stay here until the pen reaches them
        const rad = Rv * (0.1 + 0.9 * Math.sqrt(p.q));
        const ang = p.ph + vt * (2.6 - 1.5 * p.q) + rad * 0.011;
        tx = vcx + Math.cos(ang) * rad;
        ty = vcy + Math.sin(ang) * rad * 0.38 + Math.sin(vt * 2 + p.ph) * 6;
        k = 0.028 + p.kv * 0.02;
        damp = 0.9;
      } else if (phase === 'name' && p.n) {
        tx = W / 2 + p.n.u * geo.bw * namePulse;
        ty = geo.bcy + p.n.v * geo.bw * namePulse;
        const wave = Math.pow(Math.max(0, Math.cos(p.n.u * 7 - now * 2.2)), 12); // light sweeping along the letters
        p.c = p.n.c;
        p.da = (0.7 + 0.5 * wave) * (1 - 0.45 * bigA); // once the crisp name shows, the particles become its halo
        p.sz = 0.85 + 0.45 * wave;
        k = 0.026 + p.kv * 0.02;
        damp = 0.86;
      } else if (phase === 'rose' && p.small && p.n) {
        tx = W / 2 + p.n.u * geo.nw;
        ty = geo.ncy + p.n.v * geo.nw;
        const wave = Math.pow(Math.max(0, Math.cos(p.n.u * 7 - now * 1.6)), 12);
        p.c = p.n.c;
        p.da = (0.65 + 0.45 * wave) * (1 - 0.4 * smallA);
        p.sz = 0.45 + 0.3 * wave; // smaller sprites keep the small script legible
        k = 0.022 + p.kv * 0.018;
        damp = 0.86;
      } else if (phase === 'rose' && p.r) {
        const P = p.r, c = cats[P.cat];
        catPoint(P, c, tmp);
        tx = tmp.x;
        ty = tmp.y;
        p.fc = tmp.fc;
        p.c = tmp.c;
        p.dep = tmp.dep;
        p.da = 1;
        p.sz = (0.062 * geo.C * tmp.f * tmp.m * (0.85 + 0.45 * p.kv)) / p.size;
        // first the points drift in, then they hold on tight
        const L = Math.min(1, Math.max(0, (pt - 2 - p.delay) / 1.3));
        p.asm = L;
        p.isCat = true;
        catParts.push(p);
        k = (0.016 + p.kv * 0.022) * (1 - L) + 0.45 * L;
        damp = 0.87 * (1 - L) + 0.4 * L;
      } else {
        tx = p.fx * W + Math.sin(now * 0.21 + p.ph) * 24;
        ty = p.fy * H + Math.cos(now * 0.17 + p.ph * 1.3) * 18;
        k = 0.004;
        damp = 0.95;
        p.sz = 0.65;
      }
      if (pt < p.delay && phase !== 'name') k *= 0.12;
      p.vx += (tx - p.x) * k * dt;
      p.vy += (ty - p.y) * k * dt;
      if (repel) {
        const dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < 6400 && d2 > 0.01) {
          const dd = Math.sqrt(d2), force = (1 - dd / 80) * 1.4 * dt;
          p.vx += (dx / dd) * force;
          p.vy += (dy / dd) * force;
        }
      }
      const dm = Math.pow(damp, dt);
      p.vx *= dm;
      p.vy *= dm;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    for (const pe of petals) {
      pe.y += pe.vy * dt;
      pe.x += Math.sin(now * 0.8 + pe.ph) * 0.35 * dt;
      pe.rot += pe.vr * dt;
      if (pe.y > H + 24) Object.assign(pe, makePetal(false));
      if (pe.x < -24) pe.x = W + 20;
      else if (pe.x > W + 24) pe.x = -20;
    }
  }

  function drawGlow() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      if (p.isCat) continue;
      const s = p.size * p.sz;
      ctx.globalAlpha = p.a * p.da * 0.6;
      ctx.drawImage(sprites[p.c], p.x - s / 2, p.y - s / 2, s, s);
    }
    if (catParts.length) {
      // the cats are painted solid, far to near, so they hide the sea behind them
      ctx.globalCompositeOperation = 'source-over';
      catParts.sort((a, b) => b.dep - a.dep);
      for (const p of catParts) {
        const s = p.size * p.sz;
        ctx.globalAlpha = 0.25 + 0.75 * p.asm;
        ctx.drawImage(furSprites[p.fc], p.x - s / 2, p.y - s / 2, s, s);
      }
    }
  }

  // Terminal look: snap particles to a character grid, one glyph per cell
  function drawGlyphs() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = `600 ${geo.fs}px ${MONO}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    stamp += 1;
    for (const p of particles) {
      const col = Math.round(p.x / geo.cellW), row = Math.round(p.y / geo.cellH);
      if (col < 0 || row < 0 || col >= gridCols || row >= gridRows) continue;
      const key = row * gridCols + col;
      if (grid[key] === stamp) continue;
      grid[key] = stamp;
      ctx.globalAlpha = Math.min(1, p.a * p.da);
      ctx.fillStyle = PALETTE[p.c];
      ctx.fillText(p.g, col * geo.cellW, row * geo.cellH);
    }
  }

  function drawSky() {
    sctx.clearRect(0, 0, W, H);
    drawSea();
    sctx.fillStyle = STAR_COLOR;
    for (const s of stars) {
      if (seaA > 0.01 && s.y * H > geo.hy - 10) continue; // below the horizon the shore covers them
      sctx.globalAlpha = s.a * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph))) * (1 - 0.4 * seaA);
      sctx.fillRect(s.x * W, s.y * H, s.r, s.r);
    }
    if (petalsOn > 0.01) {
      sctx.fillStyle = PETAL_COLOR;
      for (const pe of petals) {
        sctx.save();
        sctx.translate(pe.x, pe.y);
        sctx.rotate(Math.sin(pe.rot) * 0.45);
        sctx.globalAlpha = 0.4 * petalsOn;
        heartPath(sctx, 0, 0, pe.s * 2.4);
        sctx.fill();
        sctx.restore();
      }
    }
    sctx.globalAlpha = 1;
  }

  function makeSparkle() {
    return {
      i: (Math.random() * Math.max(1, namePts.length)) | 0,
      t0: now + Math.random() * 1.4,
      life: 0.7 + Math.random() * 0.8,
      r: 0.5 + Math.random() * 0.8,
    };
  }

  // The name in crisp script, placed exactly where its particles sit: sky-blue fill, glow and a light sweep
  function drawNameText(cx, cy, width, alpha) {
    const m = nameMetrics, scale = width / m.tw, size = m.fontPx * scale;
    const ox = cx - ((m.right - m.left) / 2) * scale;
    const oy = cy - ((m.desc - m.asc) / 2) * scale;
    const x0 = cx - width / 2, x1 = cx + width / 2;
    fctx.font = `${size}px ${SCRIPT}`;
    fctx.textAlign = 'left';
    fctx.textBaseline = 'alphabetic';

    const base = fctx.createLinearGradient(x0, 0, x1, 0);
    base.addColorStop(0, '#d6ecff');
    base.addColorStop(0.5, '#7cc4ff');
    base.addColorStop(1, '#d6ecff');
    fctx.fillStyle = base;
    fctx.shadowColor = 'rgba(60, 150, 255, 0.9)';
    fctx.globalAlpha = alpha * 0.55;
    fctx.shadowBlur = size * 0.5 * dpr;
    fctx.fillText(currentName, ox, oy);
    fctx.globalAlpha = alpha;
    fctx.shadowBlur = size * 0.14 * dpr;
    fctx.fillText(currentName, ox, oy);
    fctx.shadowBlur = 0;

    const s = ((now * 0.32) % 1.5) - 0.25; // the sweep crosses the name, then rests off the edge
    if (!reduceMotion && s >= 0 && s <= 1) {
      const band = 0.08, clamp = (v) => Math.min(1, Math.max(0, v));
      const sweep = fctx.createLinearGradient(x0, 0, x1, 0);
      sweep.addColorStop(0, 'rgba(255,255,255,0)');
      sweep.addColorStop(clamp(s - band), 'rgba(255,255,255,0)');
      sweep.addColorStop(s, 'rgba(255,255,255,0.95)');
      sweep.addColorStop(clamp(s + band), 'rgba(255,255,255,0)');
      sweep.addColorStop(1, 'rgba(255,255,255,0)');
      fctx.fillStyle = sweep;
      fctx.fillText(currentName, ox, oy);
    }
    fctx.globalAlpha = 1;
  }

  // Four-point twinkles that pop on random spots of the letters
  function drawSparkles(cx, cy, width, alpha) {
    fctx.globalCompositeOperation = 'lighter';
    fctx.fillStyle = '#ffffff';
    const unit = Math.max(4, width / 60);
    for (const sp of sparkles) {
      const t = (now - sp.t0) / sp.life;
      if (t < 0) continue;
      if (t > 1) {
        Object.assign(sp, makeSparkle());
        continue;
      }
      const pt = namePts[sp.i];
      if (!pt) continue;
      const x = cx + pt.u * width, y = cy + pt.v * width;
      const life = Math.sin(Math.PI * t), r = unit * sp.r * life;
      fctx.globalAlpha = alpha * life;
      fctx.drawImage(sprites[GOLD], x - r * 1.6, y - r * 1.6, r * 3.2, r * 3.2);
      fctx.beginPath();
      fctx.moveTo(x, y - r * 1.4);
      fctx.quadraticCurveTo(x, y, x + r, y);
      fctx.quadraticCurveTo(x, y, x, y + r * 1.4);
      fctx.quadraticCurveTo(x, y, x - r, y);
      fctx.quadraticCurveTo(x, y, x, y - r * 1.4);
      fctx.fill();
    }
    fctx.globalCompositeOperation = 'source-over';
    fctx.globalAlpha = 1;
  }

  function drawFx() {
    fctx.clearRect(0, 0, W, H);
    drawCatFx();
    if (!nameMetrics) return;
    const layers = [[geo.bcy, geo.bw * namePulse, bigA], [geo.ncy, geo.nw, smallA]];
    for (const [cy, width, alpha] of layers) {
      if (alpha < 0.01) continue;
      drawNameText(W / 2, cy, width, alpha);
      if (!reduceMotion) drawSparkles(W / 2, cy, width, alpha);
    }
  }

  function draw() {
    // Fade the previous frame instead of clearing it, which leaves short light trails
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
    ctx.fillStyle = reduceMotion || catParts.length ? 'rgba(0,0,0,1)' : 'rgba(0,0,0,0.32)';
    ctx.fillRect(0, 0, W, H);
    if (asciiMode) drawGlyphs();
    else drawGlow();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawSky();
    drawFx();
  }

  function ensureAudio() {
    if (!soundOn) return null;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume().catch(() => {});
      return audio;
    } catch (e) {
      return null;
    }
  }

  function bell(ac, out, freq, at, len, gain) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    o2.type = 'sine';
    o2.frequency.value = freq * 2.01;
    g2.gain.value = 0.18;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g);
    o2.connect(g2);
    g2.connect(g);
    g.connect(out);
    o.start(at);
    o2.start(at);
    o.stop(at + len + 0.05);
    o2.stop(at + len + 0.05);
  }

  function chime() {
    const ac = ensureAudio();
    if (!ac) return;
    const out = ac.createGain();
    out.gain.value = 0.16;
    out.connect(ac.destination);
    const t0 = ac.currentTime + 0.02;
    [659.25, 830.61, 987.77, 1318.51, 1244.51, 987.77, 1108.73, 1661.22].forEach((f, i) => bell(ac, out, f, t0 + i * 0.13, 1.8, 0.8));
  }

  // Rising bells timed to the name being written
  function nameSound() {
    if (!audio || !soundOn) return;
    const ac = ensureAudio();
    if (!ac) return;
    const out = ac.createGain();
    out.gain.value = 0.12;
    out.connect(ac.destination);
    const t0 = ac.currentTime + 0.05;
    [783.99, 987.77, 1174.66, 1318.51, 1567.98, 1975.53].forEach((f, i) => bell(ac, out, f, t0 + i * 0.26, 2.2, 0.6));
  }

  function bloomSound() {
    if (!audio || !soundOn) return;
    const ac = ensureAudio();
    if (!ac) return;
    const out = ac.createGain();
    out.gain.value = 0.1;
    out.connect(ac.destination);
    const t0 = ac.currentTime + 0.05;
    [329.63, 415.3, 493.88, 622.25, 739.99].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.8 + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.5);
      o.connect(g);
      g.connect(out);
      o.start(t0);
      o.stop(t0 + 4.6);
    });
    [1318.51, 1661.22, 1975.53].forEach((f, i) => bell(ac, out, f, t0 + 0.3 + i * 0.22, 2.4, 0.5));
  }

  // A short synthesised meow
  function meow(base) {
    if (!audio || !soundOn) return;
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + 0.02, len = 0.5;
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(base, t0);
    o.frequency.linearRampToValueAtTime(base * 1.7, t0 + 0.14);
    o.frequency.linearRampToValueAtTime(base * 1.05, t0 + len);
    f.type = 'bandpass';
    f.Q.value = 3;
    f.frequency.setValueAtTime(900, t0);
    f.frequency.linearRampToValueAtTime(2000, t0 + 0.15);
    f.frequency.linearRampToValueAtTime(1100, t0 + len);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    o.connect(f);
    f.connect(g);
    g.connect(ac.destination);
    o.start(t0);
    o.stop(t0 + len + 0.05);
  }

  function openEnvelope() {
    if (phase !== 'intro') return;
    introEl.hidden = true;
    setPhase('opening');
    chime();
  }

  function replay() {
    messageEl.hidden = true;
    introEl.hidden = false;
    setPhase('intro');
    openBtn.focus({ preventScroll: true });
  }

  function syncToggles() {
    asciiBtn.setAttribute('aria-pressed', String(asciiMode));
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }

  openBtn.addEventListener('click', openEnvelope);
  replayBtn.addEventListener('click', replay);
  asciiBtn.addEventListener('click', () => {
    asciiMode = !asciiMode;
    prefs.write('foryou-ascii', asciiMode);
    syncToggles();
    ctx.clearRect(0, 0, W, H);
  });
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    prefs.write('foryou-sound', soundOn);
    syncToggles();
    if (soundOn) ensureAudio();
    else if (audio) audio.suspend().catch(() => {});
  });

  stage.addEventListener('pointerdown', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.seen = now;
    if (phase === 'intro') {
      if (Math.abs(e.clientX - geo.ecx) < geo.ew / 2 + 20 && Math.abs(e.clientY - geo.ecy) < geo.eh / 2 + 20) openEnvelope();
    } else if (phase === 'rose' && cats.length) {
      dragging = true;
      dragMoved = 0;
      lastPX = e.clientX;
      stage.setPointerCapture(e.pointerId);
    }
  });
  stage.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.seen = now;
    if (dragging) {
      const dx = e.clientX - lastPX;
      userYaw = Math.max(-1.1, Math.min(1.1, userYaw + dx * 0.006));
      dragMoved += Math.abs(dx);
      lastPX = e.clientX;
    }
  });
  const endDrag = () => { dragging = false; };
  stage.addEventListener('pointerup', (e) => {
    if (dragging && dragMoved < 6 && phase === 'rose' && cats.length) cheer(e.clientX, e.clientY);
    endDrag();
  });
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', () => {
    endDrag();
    pointer.seen = -1e9;
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });
  window.addEventListener('hashchange', applyName);

  // Particle roles: the first nSmall also write the small name under the rose, the next nRose build the two cats,
  // the first nBig write the big name; whoever is left over drifts as dust.
  measure();
  const count = Math.round(Math.min(7000, Math.max(4200, (W * H) / 200)));
  const nSmall = Math.round(count * 0.2), nRose = Math.round(count * 0.7);
  nBig = Math.round(count * 0.78);
  particles = Array.from({ length: count }, makeParticle);
  const rosePts = shuffle(buildCats(nRose));
  particles.forEach((p, i) => {
    p.small = i < nSmall;
    p.r = i >= nSmall ? rosePts[i - nSmall] || null : null;
  });
  stars = Array.from({ length: 190 }, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() < 0.1 ? 2 : 1 + Math.random() * 0.4,
    a: 0.25 + Math.random() * 0.55, sp: 0.5 + Math.random() * 1.8, ph: Math.random() * TAU,
  }));
  petals = Array.from({ length: 16 }, () => makePetal(true));
  applyName();
  syncToggles();
  body.dataset.phase = phase;
  openBtn.disabled = true;
  resize();

  // Both lettering faces are sampled into points, so wait for them (briefly) before building the shapes
  const fontLoads = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load(`800 40px "JetBrains Mono"`), document.fonts.load(`80px "Pinyon Script"`)])
    : Promise.resolve();
  Promise.race([fontLoads, new Promise((resolve) => setTimeout(resolve, 2500))]).catch(() => {}).then(() => {
    fontReady = true;
    buildNameTargets();
    buildEnvelopeTargets();
    setPhase('intro');
    openBtn.disabled = false;
  });

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(Math.max((t - last) / 16.667, 0), 3);
    last = t;
    now = t / 1000;
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
